# Receita de empacotamento da variante de API externa.
# Construir com:  just api build   (roda dentro desta pasta)
service: "service:QAService"
name: qa-api

labels:
  project: qa-demo
  variante: api

# O cache entra no pacote de propósito: sem ele, um contêiner sem rede não sobe.
include:
  - "service.py"
  - "api.py"
  - "context/*.json"

python:
  packages:
    - bentoml
    - "transformers<5"
    - torch
    - "sentencepiece>=0.2.0"  # o xlm-roberta não tokeniza sem isto
    - "protobuf>=5.0.0"
  extra_index_url:
    - "https://download.pytorch.org/whl/cpu"
