# Receita de empacotamento da variante de PDF.
# Construir com:  just pdf build   (roda dentro desta pasta)
service: "service:QAService"
name: qa-pdf

labels:
  project: qa-demo
  variante: pdf

# ATENÇÃO: os PDFs precisam entrar no pacote. O bentofile antigo listava
# apenas "*.py", então o bento saía sem os documentos e o serviço quebrava
# com FileNotFoundError logo na inicialização, dentro do contêiner.
include:
  - "service.py"
  - "context/*.pdf"

python:
  packages:
    - bentoml
    - "transformers<5"
    - torch
    - "pypdf>=5.0.0"          # sem isto, não há como ler os PDFs
    - "sentencepiece>=0.2.0"  # o xlm-roberta não tokeniza sem isto
    - "protobuf>=5.0.0"
  extra_index_url:
    - "https://download.pytorch.org/whl/cpu"
