# Receita de empacotamento da variante Gemma 3.
# Construir com:  just gemma3 build
service: "service:QAService"

name: qa-gemma3

labels:
  project: qa-demo
  variante: gemma3

include:
  - "service.py"

python:
  packages:
    - bentoml
    - "transformers<5"
    - torch
    - "protobuf>=5.0.0"
    - "sentencepiece>=0.2.0"
  # Puxa o torch sem CUDA. O torch padrão arrasta ~3,4 GB de bibliotecas da
  # NVIDIA que não servem para nada em máquina sem placa de vídeo.
  extra_index_url:
    - "https://download.pytorch.org/whl/cpu"
