# Receita de empacotamento da variante de PDF + RAG.
# Construir com:  just pdf_rag build   (roda dentro desta pasta)
service: "service:QAService"
name: qa-pdf-rag

labels:
  project: qa-demo
  variante: pdf_rag

# Os PDFs e o módulo de busca precisam entrar no pacote. Sem busca.py o
# serviço nem importa; sem os PDFs ele sobe e quebra na inicialização.
include:
  - "service.py"
  - "busca.py"
  - "context/*.pdf"

# Repare no que NÃO está aqui: nenhuma biblioteca de busca, nenhum banco de
# vetores, nenhum modelo de embeddings. A etapa de RAG desta variante é BM25
# escrito à mão em busca.py, com a biblioteca padrão do Python. A lista de
# dependências é idêntica à da variante pdf/.
python:
  packages:
    - bentoml
    - "transformers<5"
    - torch
    - "pypdf>=5.0.0"          # sem isto, não há como ler os PDFs
    - "sentencepiece>=0.2.0"  # o xlm-roberta não tokeniza sem isto
    - "protobuf>=5.0.0"
  extra_index_url:
    - "https://download.pytorch.org/whl/cpu"
