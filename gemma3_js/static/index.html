<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemma 3 chat</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1a16;
      --panel: #fffdf8;
      --accent: #0f6b4c;
      --muted: #6d6558;
      --user: #dceee6;
      --bot: #efeae0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7f3ec 0%, transparent 60%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid #ddd2c0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 70vh;
      max-height: 90vh;
      box-shadow: 0 12px 40px rgba(40, 30, 10, 0.08);
    }
    header {
      padding: 1rem 1.1rem 0.75rem;
      border-bottom: 1px solid #e6dccb;
    }
    header h1 {
      margin: 0;
      font: 600 1.15rem/1.2 "IBM Plex Serif", Georgia, serif;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #log {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .bubble {
      max-width: 85%;
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { align-self: flex-end; background: var(--user); }
    .assistant { align-self: flex-start; background: var(--bot); }
    .meta { color: var(--muted); font-size: 0.8rem; align-self: center; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.85rem;
      border-top: 1px solid #e6dccb;
    }
    input[type="text"] {
      flex: 1;
      border: 1px solid #d2c6b2;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font: inherit;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: #fff;
      font: 600 0.95rem/1 inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Gemma 3 270M</h1>
      <p>Hand-rolled JS chat — history stays in the browser and is resent each turn.</p>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="prompt" type="text" placeholder="Message…" autocomplete="off" required />
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
