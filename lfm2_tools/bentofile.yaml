# Receita de empacotamento da variante de tool calling.
# Construir com:  just lfm2_tools build   (roda dentro desta pasta)
service: "service:QAService"
name: qa-lfm2-tools

labels:
  project: qa-demo
  variante: lfm2_tools

# O CSV é a base de uma das ferramentas: sem ele, consultar_estoque quebra na
# primeira chamada. bancada.py entra para o benchmark rodar dentro do bento.
include:
  - "service.py"
  - "ferramentas.py"
  - "bancada.py"
  - "context/estoque_marketplace.csv"

python:
  packages:
    - bentoml
    - "transformers<5"
    - torch
  extra_index_url:
    - "https://download.pytorch.org/whl/cpu"
